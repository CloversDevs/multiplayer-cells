version: '3'
services:
  postgres:
    container_name: postgres
    image: postgres:12.2-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    build: ./game/
    container_name: nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
          exec /nakama/nakama --config /nakama/local.yml --name nakama1 --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200 --console.username ${NAKAMA_ADMIN_USERNAME} --console.password ${NAKAMA_ADMIN_PASSWORD} --session.encryption_key ${NAKAMA_SESSION_ENCRYPTION_KEY} --session.refresh_encryption_key ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY} --socket.server_key ${NAKAMA_SOCKET_SERVER_KEY} --runtime.http_key ${NAKAMA_RUNTIME_HTTP_KEY}
    restart: always
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:
      # - ./data:/nakama/data  <- comment this out for now
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: web-server
    build: ./node-js
    ports:
      - "3000:3000"
    volumes:
      - ./node-js/public:/app/public
    depends_on:
      - nakama
volumes:
  data: