<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game with Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div class="top-bar" id="top-bar">
            <span class="username" id="username">User123</span>
            <span class="settings-btn" id="settingsButton">⚙️</span>
        </div>
        <div class="settings-panel active" id="settingsPanel">
            <button id="characterSelectionButton">Character Selection</button>
            <button id="colorPickerSelectionButton">Color Picker</button>
            <button id="logoutButton">Log Out</button>
        </div>
    </div>

    <!-- Profile Selection Screen -->
    <div id="profileScreen" class="screen hidden">
        <div class="profile">
            <div class="header">
              <h2>Character Selection</h2>
              <button id="closeProfileScreenButton">❌</button>
            </div>
            <h3>Name</h3>
            <div class="portrait">
                <img id="portrait-img" src="https://via.placeholder.com/100" alt="Character Portrait">
            </div>
            <h3>Characters</h3>
            <div class="character-grid">
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😎">😎</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=🙂">🙂</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😁">😁</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😊">😊</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=⭐">⭐</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😁">😁</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=🤔">🤔</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😳">😳</button>
                <button class="char-btn" data-img="https://via.placeholder.com/100?text=😆">😆</button>
            </div>

            <h3>Powers</h3>
            <div class="powers">
                <div class="power">🔥 Power 1</div>
                <div class="power">⚡ Power 2</div>
                <div class="power">💎 Power 3</div>
            </div>
        </div>
    </div>
    
    <!-- Color Picker -->
    <div id="colorPickerScreen" class="screen hidden">
      <div class="header">
        <h2>Character Selection</h2>
        <button id="closeColorPickerScreenButton">❌</button>
      </div>
      <input type="color" id="colorPicker" value="#ff0000">
      <div id="colorBox" style="background-color: #ff0000;"></div>
    </div>

    <!-- Game Scripts -->
    <script src="./bundle.js"></script>
</body>
</html>
